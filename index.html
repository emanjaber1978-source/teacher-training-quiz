const API_URL="PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"; // ضع هنا رابط Google Apps Script بعد نشره
const qs=document.getElementById("qs");
QUESTIONS.forEach((x,i)=>{let d=document.createElement("div");d.className="q";let o=x.options.map((v,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${v}</label>`).join("");d.innerHTML=`<h3>${i+1}. ${x.q}</h3>${o}`;qs.appendChild(d)});
document.querySelectorAll("input[type=radio]").forEach(x=>x.onchange=progress);
function progress(){let n=0;for(let i=0;i<20;i++)if(document.querySelector(`input[name=q${i}]:checked`))n++;document.getElementById("pt").textContent=`${n} من 20 مجاب`;document.getElementById("bar").style.width=n*5+"%"}
document.getElementById("quiz").onsubmit=async e=>{
e.preventDefault();let name=document.getElementById("name").value.trim();if(!name)return alert("يرجى كتابة اسم المعلم.");
let score=0,miss=[];QUESTIONS.forEach((x,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(!a)miss.push(i+1);else if(+a.value===x.answer)score++});
if(miss.length)return alert("يرجى الإجابة عن جميع الأسئلة. غير المجاب: "+miss.join("، "));
let pct=Math.round(score/20*100);document.getElementById("result").style.display="block";document.getElementById("score").textContent=`${score} / 20 — ${pct}%`;
let msg=document.getElementById("msg"),box=document.getElementById("certBox");
if(pct>=70){msg.className="ok";msg.innerHTML="<h3>🎉 مبارك! تم اجتياز الاختبار.</h3>";box.style.display="block";makeCert(name,pct);}
else{msg.className="no";msg.innerHTML="<h3>لم تحقق نسبة 70% بعد.</h3><p>يمكنك إعادة الاختبار.</p>";box.style.display="none"}
if(API_URL)try{await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:name,score:score,percentage:pct,date:new Date().toISOString(),passed:pct>=70})})}catch(err){}
scrollTo({top:document.getElementById("result").offsetTop-20,behavior:"smooth"});
};
function makeCert(name,pct){let c=document.getElementById("cert"),ctx=c.getContext("2d"),im=new Image();im.onload=()=>{c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.drawImage(im,0,0);let s=c.width/1055;ctx.textAlign="center";ctx.direction="rtl";ctx.fillStyle="#6e501c";ctx.font=`bold ${Math.round(27*s)}px Tahoma,Arial`;ctx.fillText(name,c.width/2,365*s);ctx.fillStyle="#444";ctx.font=`${Math.round(15*s)}px Tahoma,Arial`;ctx.fillText(`نسبة الاجتياز: ${pct}%`,c.width/2,405*s)};im.src=CERT}
document.getElementById("download").onclick=()=>{let a=document.createElement("a");a.download="شهادة_"+document.getElementById("name").value+".png";a.href=document.getElementById("cert").toDataURL("image/png");a.click()};
document.getElementById("retry").onclick=()=>location.reload();
